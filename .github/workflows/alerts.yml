name: Market Movers alerts

on:
  schedule:
    # Every 5 minutes, 12:00-22:00 UTC, weekdays. That window covers US
    # pre-market through after-hours in both EST and EDT; the script itself
    # checks the actual market clock and exits immediately when closed.
    - cron: "*/5 12-22 * * 1-5"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test notification instead of screening"
        type: boolean
        default: false
      force_run:
        description: "Run even when the market is closed"
        type: boolean
        default: false

concurrency:
  group: market-movers-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install yfinance
        run: pip install --quiet -r requirements.txt

      # Alert state has to survive between runs, otherwise every run would
      # re-announce the same stock. Each run writes a new cache entry; the
      # restore-key prefix pulls back the most recent one.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: mm-state-${{ github.run_id }}
          restore-keys: mm-state-

      - name: Run screener
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          FORCE_RUN: ${{ inputs.force_run && '1' || '0' }}
        run: python alerts_bot.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: mm-state-${{ github.run_id }}
