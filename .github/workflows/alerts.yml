name: Market Movers alerts

on:
  schedule:
    # Every 5 minutes, around the clock. Crypto never closes, so the script
    # screens it on every run; the stock screen inside the script checks the
    # real market clock and skips itself when the market is shut.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test notification instead of screening"
        type: boolean
        default: false
      force_run:
        description: "Screen stocks even when the market is closed"
        type: boolean
        default: false

concurrency:
  group: market-movers-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install yfinance
        run: pip install --quiet -r requirements.txt

      # Alert state has to survive between runs, otherwise every run would
      # re-announce the same mover. Each run writes a new cache entry; the
      # restore-key prefix pulls back the most recent one.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: mm-state-${{ github.run_id }}
          restore-keys: mm-state-

      - name: Robinhood gate diagnostic
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          UA = "Mozilla/5.0 (compatible; market-movers-alerts/1.0)"
          for kind, sym in [("crypto","BTC"), ("crypto","MARSCOIN"),
                            ("crypto","ZZZZFAKE"), ("stocks","AAPL"),
                            ("stocks","ZZZZFAKE")]:
              url = f"https://robinhood.com/{kind}/{sym}"
              req = urllib.request.Request(url, method="HEAD",
                                           headers={"User-Agent": UA})
              try:
                  with urllib.request.urlopen(req, timeout=8) as r:
                      print(f"{kind}/{sym:10s} -> {r.status}")
              except urllib.error.HTTPError as e:
                  print(f"{kind}/{sym:10s} -> HTTPError {e.code}")
              except Exception as e:
                  print(f"{kind}/{sym:10s} -> ERR {type(e).__name__}: {str(e)[:80]}")
          PY

      - name: Run screener
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          FORCE_RUN: ${{ inputs.force_run && '1' || '0' }}
        run: |
          mkdir -p state
          python alerts_bot.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: mm-state-${{ github.run_id }}
