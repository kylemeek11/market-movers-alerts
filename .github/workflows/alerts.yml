name: Market Movers alerts

on:
  schedule:
    # Every 5 minutes, around the clock. Crypto never closes, so the script
    # screens it on every run; the stock screen inside the script checks the
    # real market clock and skips itself when the market is shut.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Send a test notification instead of screening"
        type: boolean
        default: false
      force_run:
        description: "Screen stocks even when the market is closed"
        type: boolean
        default: false

concurrency:
  group: market-movers-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install yfinance
        run: pip install --quiet -r requirements.txt

      # Alert state has to survive between runs, otherwise every run would
      # re-announce the same mover. Each run writes a new cache entry; the
      # restore-key prefix pulls back the most recent one.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: mm-state-${{ github.run_id }}
          restore-keys: mm-state-

      - name: ADR field diagnostic
        run: |
          python - <<'PY'
          import yfinance as yf
          from yfinance import EquityQuery
          q = EquityQuery("and", [
              EquityQuery("gt", ["percentchange", 1.0]),
              EquityQuery("eq", ["region", "us"]),
              EquityQuery("gt", ["dayvolume", 100000]),
              EquityQuery("gt", ["intradayprice", 3.0]),
          ])
          resp = yf.screen(q, offset=0, size=100, sortField="percentchange", sortAsc=False)
          quotes = (resp or {}).get("quotes", []) or []
          print("rows:", len(quotes))
          keys = sorted({k for q_ in quotes for k in q_.keys()})
          print("ALL KEYS:", keys)
          print()
          cands = ["symbol","shortName","longName","quoteType","typeDisp","exchange",
                   "fullExchangeName","market","financialCurrency","currency","region"]
          for q_ in quotes[:20]:
              print({k: q_.get(k) for k in cands if k in q_})
          PY

      - name: Run screener
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '0' }}
          FORCE_RUN: ${{ inputs.force_run && '1' || '0' }}
        run: |
          mkdir -p state
          python alerts_bot.py

      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: mm-state-${{ github.run_id }}
