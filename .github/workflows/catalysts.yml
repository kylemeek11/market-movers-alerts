name: Catalyst watcher

on:
  schedule:
    # Backup only. Since 2026-10-21 the dispatcher (the "Market Movers
    # dispatcher" Apps Script) starts the daily job at the first tick from
    # 6 AM Central on weekdays and the weekly job at the first tick from 5 PM
    # Central on Sundays, because GitHub's own cron ran this hours late or not
    # at all. The daily cron stays as a backup: a second daily run re-alerts
    # nothing, since the state restored from the first run already lists the
    # filings. The weekly cron was removed: a second weekly run would send the
    # digest twice.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [weekly, daily, test]
        default: weekly

concurrency:
  group: catalyst-watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Only needed for the float / short-interest screen in the weekly job.
      - name: Install yfinance
        run: pip install --quiet yfinance

      - name: Restore catalyst state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: catalyst-state-${{ github.run_id }}
          restore-keys: catalyst-state-

      # Which job: the dispatcher (or a hand run) says; a backup cron run is
      # the daily poll.
      - name: Pick the job
        id: pick
        run: |
          if [ -n "${{ inputs.job }}" ]; then
            echo "flag=--${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the watcher
        env:
          NTFY_CATALYST_TOPIC: ${{ secrets.NTFY_CATALYST_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python catalysts.py ${{ steps.pick.outputs.flag }}

      - name: Save catalyst state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: catalyst-state-${{ github.run_id }}
